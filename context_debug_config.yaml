# Debug configuration for Saturn Context Engine
# Set enable_context_engine to false to disable context compression while debugging

# Context Engine Settings
enable_context_engine: false  # Temporarily disable for debugging

# Standard Saturn configuration
llm_provider: gemini
gemini_model: gemini-2.5-pro

# Vector store configuration  
vector_store: chroma
rag_build_on_init: true

# Performance settings
max_retries: 3
execution_mode: auto

# Cloud provider settings
gcp_project_id: your-project-id
working_directory: .

# Context Engine Configuration (when enabled)
context_settings:
  max_context_tokens: 8000
  max_recent_messages: 10
  min_importance_threshold: 0.3
  compression_threshold: 20
  cache_ttl: 60 